name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Ruff lint
        run: uv run --no-project --with ruff ruff check src tests

      - name: Install dependencies
        run: uv sync

      - name: Run CPU structural tests
        run: uv run python -m unittest discover -s tests -v
