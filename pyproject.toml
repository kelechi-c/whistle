[project]
name = "whistle"
version = "0.1.0"
description = "Low-latency Qwen3 speech inference experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "qwen-tts>=0.1",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
